# Temporary: tries suggestion addresses for the engines that answered
# nothing in the Suggestion endpoints run. To be removed.
name: Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try addresses
        run: |
          ours='NovaReduxConnect/1 (Android)'
          ff='Mozilla/5.0 (Android 15; Mobile; rv:140.0) Gecko/140.0 Firefox/140.0'
          try() {
            ua="$1"; url="$2"
            code=$(curl -s -o /tmp/body -w '%{http_code} %{content_type}' -A "$ua" -H 'Accept-Language: en-US' "$url")
            echo "== [$code] ua=${ua:0:20} $url"
            head -c 300 /tmp/body; echo
          }
          for ua in "$ours" "$ff"; do
            try "$ua" 'https://www.bing.com/osjson.aspx?query=weather&mkt=en-US'
            try "$ua" 'https://www.bing.com/osjson.aspx?query=weather&cc=US&setlang=en-US'
            try "$ua" 'https://api.bing.com/qsonhs.aspx?type=cb&q=weather'
            try "$ua" 'https://www.bing.com/qsonhs.aspx?type=cb&q=weather'
            try "$ua" 'https://api.bing.com/osjson.aspx?query=weather&mkt=en-US'
            try "$ua" 'https://www.bing.com/AS/Suggestions?pt=page.serp&mkt=en-US&qry=weather&cp=7&cvid=0'
          done
          curl -s -D - -o /dev/null -A "$ff" 'https://www.bing.com/osjson.aspx?query=weather' | head -30
