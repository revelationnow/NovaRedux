# Photographs the launcher on an emulator, for checking how a change looks
# without a phone. Run it from the Actions tab or the API; the screenshots
# are printed into the job log (see tools/ci/screens.sh) and kept as an
# artifact. It also fails if the app crashes on the way.
name: Screens

on:
  workflow_dispatch:
    inputs:
      args:
        description: 'Extra instrumentation arguments, e.g. "-e pref.b.dock_enabled false -e shots home,drawer"'
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Accept Android SDK licences
        run: |
          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          yes | "$sdkmanager" --licenses > /dev/null

      - name: Build the app, the tour and NovaRedux Connect
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest :connect:assembleDebug

      - name: Enable KVM and ImageMagick
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          command -v convert || (sudo apt-get update -q && sudo apt-get install -y -q imagemagick)

      - name: Photograph on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TOUR_ARGS: ${{ inputs.args }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          disable-animations: true
          script: bash tools/ci/screens.sh

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screens
          path: screens/
          if-no-files-found: ignore
