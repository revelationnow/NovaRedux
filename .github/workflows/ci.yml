# Checks every push to main or dev and every pull request: lint, detekt,
# unit tests and a debug APK. Release signing and F-Droid's reproducible
# build are untouched; this only builds the debug variant.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle and checks the wrapper jar against Gradle's checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Accepts the SDK licences so AGP can fetch the compileSdk platform.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Lint, detekt, unit tests and debug build
        run: >
          ./gradlew --stacktrace
          :app:lintDebug
          :app:detekt
          :app:testDebugUnitTest
          :app:assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: supernova-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
