# Checks every push to main or dev and every pull request: lint, detekt,
# unit tests and debug APKs of NovaRedux and of NovaRedux Connect (its
# companion app). Release signing and F-Droid's reproducible build are
# untouched; this only builds the debug variants. A push to main also leaves
# its debug APKs on a draft release (the debug-release job).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Checks the wrapper jar against Gradle's checksums and caches Gradle.
      # "basic" is the open-source (MIT) cache; the default one is proprietary.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The runner image already ships an Android SDK in $ANDROID_HOME.
      # Accepting its licences lets AGP download the compileSdk platform and
      # build tools itself. (android-actions/setup-android is not used: it
      # asks sdkmanager for the retired "tools" package, which now fails.)
      - name: Accept Android SDK licences
        run: |
          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          echo "Using $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null

      # One debug signing key for main's builds, so a newer debug APK from
      # the draft release installs over an older one. It lives in the
      # Actions cache (GitHub drops an entry after a week without use) and
      # is made here on a miss, with the standard debug credentials, in the
      # folder the build step names as ANDROID_USER_HOME: where AGP looks
      # for it. (Left to itself, AGP kept it somewhere other than
      # ~/.android on this runner image.)
      - name: Debug signing key
        id: debug-key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/android-user/debug.keystore
          key: debug-keystore-v1

      - name: Make the debug signing key
        if: steps.debug-key.outcome == 'success' && steps.debug-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/android-user"
          keytool -genkeypair -keystore "$RUNNER_TEMP/android-user/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # Its certificate, to match against the one the draft release shows.
      - name: Debug signing key's certificate
        if: steps.debug-key.outcome == 'success'
        run: keytool -list -v -keystore "$RUNNER_TEMP/android-user/debug.keystore" -storepass android | grep SHA256

      - name: Lint, detekt, unit tests and debug build
        env:
          # Where AGP finds the debug signing key, or makes one.
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user
        run: >
          mkdir -p "$ANDROID_USER_HOME" &&
          ./gradlew --stacktrace --continue
          :app:lintDebug
          :app:detekt
          :app:testDebugUnitTest
          :app:assembleDebug
          :connect:lintDebug
          :connect:detekt
          :connect:testDebugUnitTest
          :connect:assembleDebug

      # Lint names only its first error in the console; the rest are in its
      # text report, printed here when a check failed.
      - name: Print lint findings
        if: failure()
        run: |
          for report in app/build/reports/lint-results-debug.txt connect/build/reports/lint-results-debug.txt; do
            if [ -f "$report" ]; then echo "== $report"; cat "$report"; fi
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            connect/build/reports/
            connect/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: novaredux-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload NovaRedux Connect debug APK
        uses: actions/upload-artifact@v7
        with:
          name: novaredux-connect-debug-apk
          path: connect/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # A build of main (a push, or a run started by hand) puts its debug APKs
  # on the draft release "Debug build (newest main)", replacing the last
  # ones: plain APK links, the same every time, that install from a phone
  # signed in to GitHub. A draft is seen only by people who can push here,
  # and makes no tag (tools/ci/debug_release.sh).
  debug-release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: novaredux-debug-apk
          path: apk/app

      - uses: actions/download-artifact@v7
        with:
          name: novaredux-connect-debug-apk
          path: apk/connect

      - name: Put them on the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: tools/ci/debug_release.sh apk/app/*.apk apk/connect/*.apk
