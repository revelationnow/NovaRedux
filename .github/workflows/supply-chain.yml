# Run by hand when Gradle or a dependency changes (#22, from a security
# review). It prints what the build pins, for a commit:
# - the Gradle distribution's checksum as Gradle publishes it, for
#   distributionSha256Sum in gradle/wrapper/gradle-wrapper.properties;
# - gradle/verification-metadata.xml written afresh (SHA-256 of every
#   plugin and library the builds fetch), gzipped and base64-encoded between
#   VERIFICATION-BEGIN and VERIFICATION-END in the log of its last job.
# With that file in the repository, Gradle checks every artifact it fetches
# against it and stops on a mismatch or an artifact it doesn't list.
name: Supply chain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Everything a build on Linux fetches: every task CI, Release, Screens and
  # the endpoint check run.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-disabled: true

      - name: Gradle's own checksum of the distribution
        run: |
          url=$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | sed 's/\\:/:/g')
          echo "distributionUrl: $url"
          echo "distributionSha256Sum=$(curl -fsSL "$url.sha256")"

      - name: Accept Android SDK licences
        run: |
          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          yes | "$sdkmanager" --licenses > /dev/null

      # A fresh file with only its rules, which Gradle keeps as it fills the
      # file in. Sources and javadoc jars are trusted unchecked: Android
      # Studio fetches them to show library code, and no build uses them.
      - name: Start the file afresh
        run: |
          cat > gradle/verification-metadata.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <verification-metadata xmlns="https://schema.gradle.org/dependency-verification" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="https://schema.gradle.org/dependency-verification https://schema.gradle.org/dependency-verification/dependency-verification-1.3.xsd">
             <configuration>
                <verify-metadata>true</verify-metadata>
                <verify-signatures>false</verify-signatures>
                <trusted-artifacts>
                   <trust file=".*-javadoc[.]jar" regex="true"/>
                   <trust file=".*-sources[.]jar" regex="true"/>
                </trusted-artifacts>
             </configuration>
             <components>
             </components>
          </verification-metadata>
          EOF

      # Unsigned here: no release key is needed to resolve what a release
      # build uses.
      - name: Write the verification metadata
        run: >
          ./gradlew --stacktrace --continue --write-verification-metadata sha256
          :app:lintDebug :app:detekt :app:testDebugUnitTest :app:assembleDebug
          :app:assembleDebugAndroidTest :app:assembleRelease
          :connect:lintDebug :connect:detekt :connect:testDebugUnitTest :connect:assembleDebug
          :connect:assembleRelease

      - name: Keep it for the next job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          overwrite: true

  # What a build on macOS fetches besides (its own aapt2), so contributors
  # can build there too. Writing the file resolves every configuration of
  # the build, whatever task runs.
  macos:
    needs: linux
    if: always()
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-disabled: true

      - name: The file so far
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: verification-metadata
          path: gradle

      - name: Add this platform's artifacts
        run: ./gradlew --stacktrace --write-verification-metadata sha256 help

      - name: Keep it for the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          overwrite: true

  # The same for Windows, with the wrapper's batch script (the repository
  # pins no line endings, so gradlew may check out with Windows ones).
  windows:
    needs: macos
    if: always()
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-disabled: true

      - name: The file so far
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: verification-metadata
          path: gradle

      - name: Add this platform's artifacts
        run: .\gradlew.bat --stacktrace --write-verification-metadata sha256 help

      - name: Keep it for the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          overwrite: true

  print:
    needs: windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The file
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: verification-metadata
          path: gradle

      - name: Print it
        run: |
          wc -c gradle/verification-metadata.xml
          sha256sum gradle/verification-metadata.xml
          echo "VERIFICATION-BEGIN"
          gzip -9c gradle/verification-metadata.xml | base64 -w 0
          echo
          echo "VERIFICATION-END"
